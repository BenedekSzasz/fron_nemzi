<select (change)="switchLanguage($event)" class="language-select mb-3">
  <option value="en">Angol</option>
  <option value="hu">Magyar</option>
  <option value="de">Német</option>
  <option value="jp">Japán</option>
</select>

<h2>{{ 'app.title' | translate }}</h2>

<p>
  {{ 'app.hello' | translate }}
</p>

<p>
  {{ name }}
</p>

<p>
   {{ 'app.helloMessage' | translate:{name} }}
</p>
